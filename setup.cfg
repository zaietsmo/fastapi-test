[flake8]
max-line-length = 88

# Exclude directories and files
exclude = 
    .git,
    __pycache__,
    */migrations/*,
    venv,
    .venv,
    env,
    .env,
    build,
    dist

# Ignore specific errors/warnings
# Whitespace before ':'
# Line break before binary operator
# Missing whitespace after ','
ignore =
    E203,
    W503,
    E231,

max-complexity = 10

select = C,E,F,W,B,B950

statistics = True
count = True

# Per-file ignore patterns
per-file-ignores =
    __init__.py: F401
    */settings.py: E501
    menu.py: E501
    main.py: F841
    middlewares.py: F401
    pipelines.py: F401

# Docstring style checking
docstring-convention = google 