services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - scraped-data:/app/scraper/output
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    restart: unless-stopped
    command: ["gunicorn", "app.main:app", "-k", "uvicorn.workers.UvicornWorker", "--bind 0.0.0.0:80", "--workers", "2", "timeout", "60"]
    container_name: mcdonalds-api

  scraper:
    build: .
    volumes:
      - scraped-data:/app/scraper/output
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    restart: unless-stopped
    command: ["./startup.sh"]
    container_name: mcdonalds-scraper

volumes:
  scraped-data:
